<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conversion links QA comparison</title>
  <style>

<body>

  <section class="pair"><h2>日焼け止め：ヒーロー</h2><div class="grid">

    <figure><figcaption>修正後</figcaption><img src="implementation-uv-hero.png" alt=""></figure>
  </div></section>
  <section class="pair"><h2>日焼け止め：商品カード</h2><div class="grid">
    <figure><figcaption>修正前</figcaption><img src="source-uv-product-card.png" alt=""></figure>

  <section class="pair"><h2>日焼け止め：Pinterest画像</h2><div class="grid">

  </div></section>
  <section class="pair"><h2>美容液：商品カード</h2><div class="grid">

  </div></section>

</html>
